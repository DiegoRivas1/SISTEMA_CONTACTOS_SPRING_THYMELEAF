<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script th:src="@{/js/navbar.js}" defer></script>
    <title>Sistema de Contactos | Cyberpunk Edition</title>
</head>
<body>
<!-- NAVBAR CYBERPUNK -->
<div class="container">
    <nav class="navbar sticky-top d-flex justify-content-start align-items-center">
        <button class="btn" type="button">
            <a href="/">
                <i class="fas fa-cube me-2"></i>
                <span>// SISTEMA-CONTACTOS</span>
            </a>
        </button>
        <button class="btn" type="button">
            <a href="/">
                <i class="fas fa-terminal me-1"></i>
                [INICIO]
            </a>
        </button>
        <button class="btn" type="button">
            <a href="/agregar">
                <i class="fas fa-user-plus me-1"></i>
                [AGREGAR]
            </a>
        </button>
    </nav>
</div>

<!-- CONTENIDO PRINCIPAL CYBERPUNK -->
<div class="container mt-5">
    <div class="row">
        <div class="col-12 text-center">
            <h3 class="cyber-title" data-text="SISTEMA DE CONTACTOS">
                SISTEMA DE CONTACTOS
            </h3>

            <!-- Tabla listado de Empleados-->
            <!-- Tabla listado de Empleados -->
            <div class="row mt-5 justify-content-center">
                <div class="col-md-10">
                    <div class="card cyber-card">
                        <div class="card-body">
                            <h5 class="text-white mb-4">
                                <i class="fas fa-database me-2"></i>
                                // LISTADO DE CONTACTOS
                            </h5>

                            <div class="cyber-table-container">
                                <table class="table cyber-table">
                                    <thead>
                                        <tr>
                                            <th scope="col">ID</th>
                                            <th scope="col">NOMBRE</th>
                                            <th scope="col">CELULAR</th>
                                            <th scope="col">EMAIL</th>
                                            <th scope="col">ESTADO</th>
                                            <th scope="col">PAIS</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="contacto : ${contactos}">
                                            <td th:text="${contacto.idContacto}"></td>
                                            <td th:text="${contacto.nombre}"></td>
                                            <td th:text="${contacto.celularCompleto}"></td>
                                            <td th:text="${contacto.email}"></td>
                                            <!--
                                             <td>
                                                <span th:if="${contacto.estado}" class="status-badge status-active">Activo</span>
                                                <span th:unless="${contacto.estado}" class="status-badge status-inactive">Inactivo</span>
                                            </td>
                                             -->

                                            <!--
                                             <td th:text="${contacto.estaActivo}"></td>
                                             -->
                                            <td>
                                                <span class="status-badge"
                                                      th:classappend="${contacto.estado} ? 'status-active' : 'status-inactive'"
                                                      th:text="${contacto.estadoTexto}">
                                                </span>
                                            </td>
                                            <td th:text="${contacto.pais.nombrePais}"></td>
                                        </tr>
                                        <!-- <tr>
                                            <td>001</td>
                                            <td>JOHN DOE</td>
                                            <td>+51 123 456 789</td>
                                            <td>john.doe@cyber.com</td>
                                            <td><span class="status-badge status-active">ACTIVO</span></td>
                                        </tr> -->

                                    </tbody>
                                </table>
                            </div>

                            <!-- Info adicional cyberpunk -->
                            <div class="mt-3 text-end">
                    <span class="text-cyber-green small">
                        <i class="fas fa-circle me-1" style="font-size: 8px;"></i>
                        REGISTROS ENCONTRADOS: 3
                    </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Tarjetas cyberpunk -->
            <div class="row mt-5 justify-content-center">
                <div class="col-md-4 mb-4">
                    <div class="card cyber-card">
                        <div class="card-body">
                            <i class="fas fa-users fa-3x mb-3"></i>
                            <h5 class="text-white">// GESTIONAR</h5>
                            <p class="text-white-50">Accede a tu base de contactos</p>
                            <div class="cyber-stats">
                                <span class="badge bg-dark text-cyber-green">42 CONTACTOS</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card cyber-card">
                        <div class="card-body">
                            <i class="fas fa-chart-line fa-3x mb-3"></i>
                            <h5 class="text-white">// ESTADÍSTICAS</h5>
                            <p class="text-white-50">Analiza tus conexiones</p>
                            <div class="cyber-stats">
                                <span class="badge bg-dark text-cyber-blue">ACTIVO</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>
</div>

<!-- FOOTER CYBERPUNK (OPCIONAL) -->
<footer class="container mt-5">
    <div class="text-center text-white-50 small">
        <span class="cyber-footer">© 2025 // SISTEMA DE CONTACTOS v1.0 [CYBERPUNK EDITION]</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
